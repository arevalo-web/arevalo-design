<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — arevalo.design</title>
    <meta
      name="description"
      content="Page not found. Return to the portfolio of Eribert Arevalo, graphic designer."
    />
    <meta name="robots" content="noindex" />

    <!-- Root-absolute paths on purpose: a 404 page can be served from any URL depth -->
    <link
      rel="preload"
      href="/assets/fonts/roboto-slab-v36-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/roboto-slab-v36-latin-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/roboto-slab-v36-latin-200.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/cal-sans-v2-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />

    <!-- class hook + saved theme before paint; if script.js never loads, un-hide the fade-in content -->
    <script>
      (function () {
        var r = document.documentElement;
        r.classList.add("js");
        try {
          if (localStorage.getItem("theme") === "dark")
            r.classList.add("theme-dark");
        } catch (e) {}
        setTimeout(function () {
          if (!r.classList.contains("js-ready")) r.classList.remove("js");
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <a class="skip-link h2" href="#main">[Skip to content]</a>

    <div class="sheet">
      <header class="site-header">
        <a
          class="site-logo border-r"
          href="/"
          aria-label="Eribert Arevalo, home"
        >
          <img
            class="site-logo__img site-logo__img--light"
            src="/assets/logo/logo.svg"
            alt=""
          />
          <img
            class="site-logo__img site-logo__img--dark"
            src="/assets/logo/logow.svg"
            alt=""
            aria-hidden="true"
          />
        </a>
        <div class="hero" id="site-menu">
          <nav class="hero-nav" aria-label="Primary">
            <a class="h2" href="/">[Case Studies]</a>
            <a class="h2" href="/gallery/">[Gallery]</a>
            <a class="h2" href="/about/">[About]</a>
          </nav>
          <button
            class="theme-switch h2"
            type="button"
            aria-pressed="false"
            aria-label="Dark mode"
          >
            [<span class="opt opt-light">Light</span> /
            <span class="opt opt-dark">Dark</span>]
          </button>
        </div>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-menu"
          aria-label="Open menu"
        >
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
        </button>
        <div class="cell border-l"></div>
      </header>

      <!-- rows: header-gap (0) | message (fills the page) | footer -->
      <div class="frame" style="grid-template-rows: 0 1fr auto">
        <!-- ROW 2: message -->
        <div
          class="cell border-r border-b"
          style="grid-column: 1; grid-row: 2"
        ></div>

        <main
          class="error-page border-b"
          id="main"
          tabindex="-1"
          style="grid-column: 2 / 7; grid-row: 2"
        >
          <p class="thin error-page__code">Error 404</p>
          <h1 class="title">Page not found</h1>
          <p class="body error-page__message">
            The page you’re looking for doesn’t exist, or it has moved somewhere
            else.
          </p>
          <a class="h2 error-page__link" href="/">[Return Home]</a>
        </main>

        <div
          class="cell border-l border-b"
          style="grid-column: 7; grid-row: 2"
        ></div>

        <!-- ROW 3: footer -->
        <div class="cell border-r" style="grid-column: 1; grid-row: 3"></div>
        <div class="footer" style="grid-column: 2 / 7; grid-row: 3">
          <span>© 2026 Eribert Arevalo. All rights reserved.</span>
          <span
            >Get in touch:
            <a class="footer__link" href="mailto:eribert.arevalo@gmail.com"
              >eribert.arevalo@gmail.com</a
            ></span
          >
        </div>
        <div class="cell border-l" style="grid-column: 7; grid-row: 3"></div>
      </div>
    </div>

    <script src="/js/script.js"></script>
  </body>
</html>
